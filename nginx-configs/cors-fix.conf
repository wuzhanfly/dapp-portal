# zkSync Portal BSC - CORS 修复版本
server {
    listen 80;
    server_name testnet-bridge.maichain.org;
    
    # CORS 配置 - 避免重复头部
    set $cors_origin "";
    set $cors_cred   "";
    set $cors_header "";
    set $cors_method "";

    # 检查 Origin 头部并设置相应的 CORS 值
    if ($http_origin ~ '^https?://(localhost|.*\.maichain\.org)$') {
        set $cors_origin $http_origin;
        set $cors_cred   true;
        set $cors_header "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control";
        set $cors_method "GET, POST, OPTIONS, PUT, DELETE";
    }

    # 添加 CORS 头部 (只添加一次)
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Credentials $cors_cred always;
    add_header Access-Control-Allow-Headers $cors_header always;
    add_header Access-Control-Allow-Methods $cors_method always;

    # 处理 OPTIONS 预检请求
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  $cors_origin;
        add_header Access-Control-Allow-Credentials true;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
        add_header Access-Control-Max-Age 86400;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # 代理设置
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    
    # 主应用代理
    location / {
        # 移除可能存在的重复 CORS 头部
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        
        # 代理到 zkSync Portal
        proxy_pass http://zksync-portal-bsc:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # API 代理 (如果需要代理到其他 API)
    location /api/ {
        # 移除重复头部
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        
        proxy_pass http://zksync-portal-bsc:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 健康检查
    location /health {
        access_log off;
        proxy_pass http://zksync-portal-bsc:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_pass http://zksync-portal-bsc:3000;
        proxy_set_header Host $host;
        
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}