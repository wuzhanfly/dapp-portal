# zkSync Bridge Proxy Configuration
# 监听 80 端口，代理到 Docker 容器 8080 端口
# Cloudflare 处理 SSL 终止

server {
    listen 80;
    server_name testnet-bridge.maichain.org;

    # 日志配置
    access_log /var/log/nginx/bridge.access.log;
    error_log /var/log/nginx/bridge.error.log;

    # 客户端配置
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # 主应用代理
    location / {
        # 代理到 Docker 容器 (8080端口)
        proxy_pass http://127.0.0.1:8080;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 如果 Cloudflare 传递了原始协议，使用它
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 健康检查端点
    location /health {
        access_log off;
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
    }
}