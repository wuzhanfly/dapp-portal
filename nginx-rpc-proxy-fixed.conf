server {
    listen 80;
    server_name _;
    
    # RPC 代理路径 - 代理到 ZK BSC Chain RPC
    location /rpc {
        # 移除后端可能返回的 CORS 头部
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        
        # 设置正确的 CORS 头部
        add_header Access-Control-Allow-Origin "https://testnet-bridge.maichain.org" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        # 移除 /rpc 前缀并代理到实际的 RPC 端点
        rewrite ^/rpc/?(.*)$ /$1 break;
        proxy_pass https://testnet-node-0.maichain.org;
        
        # 代理设置
        proxy_set_header Host testnet-node-0.maichain.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Chain-Type "L2";
        proxy_set_header X-Chain-ID "9720";
        proxy_http_version 1.1;
        
        # SSL 设置
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        
        # 超时设置
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
        
        # 错误处理
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
    
    # API 代理路径 - 代理到区块链浏览器 API
    location /api/ {
        # 移除后端可能返回的 CORS 头部
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        
        # 设置正确的 CORS 头部
        add_header Access-Control-Allow-Origin "https://testnet-bridge.maichain.org" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        # 移除 /api 前缀并代理到实际的 API 端点
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://54.255.170.191:3002;
        
        # 代理设置
        proxy_set_header Host 54.255.170.191:3002;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        
        # 超时设置
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
        
        # 错误处理
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # 健康检查
    location /health {
        proxy_pass http://zksync-portal-bsc:3000/health;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }
    
    # 主应用代理
    location / {
        proxy_pass http://zksync-portal-bsc:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}