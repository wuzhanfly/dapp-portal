version: '3.8'

services:
  # zkSync Portal BSC 应用
  zksync-portal-bsc:
    image: zksync-portal-bsc:latest
    container_name: zksync-portal-bsc
    # 只在内部网络中暴露，不映射到主机端口
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NODE_TYPE=hyperchain
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zksync-network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: zksync-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-configs/static-bridge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/webroot:/var/www/html:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    restart: unless-stopped
    networks:
      - zksync-network
    depends_on:
      - zksync-portal-bsc

volumes:
  certbot-etc:
  certbot-var:

networks:
  zksync-network:
    driver: bridge