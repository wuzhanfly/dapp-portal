version: '3.8'

services:
  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: zksync-bridge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx-configs/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - zksync-bridge
    networks:
      - bridge-network

  # zkSync Portal Bridge 应用
  zksync-bridge:
    image: zksync-portal-bsc:latest
    container_name: zksync-bridge
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NODE_TYPE=hyperchain
      - WALLET_CONNECT_PROJECT_ID=a1be95859dbb2348a4aa5c370a0cae57
      - SENTRY_ENV=production
      - GIT_COMMIT_HASH=docker-build
      - GIT_REPO_URL=https://github.com/matter-labs/dapp-portal
    volumes:
      - ./config.js:/usr/share/nginx/html/config.js:ro
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bridge-network

networks:
  bridge-network:
    driver: bridge